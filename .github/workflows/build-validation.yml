name: Build Validation

on:
  pull_request:
  workflow_call:
    inputs:
      head_ref:
        description: 'The head ref of the PR'
        required: false
        type: string
      event_name:
        description: 'The event name'
        required: false
        type: string

jobs:
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ inputs.head_ref || github.head_ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify dependencies
        run: "echo skipped-for-baseline-isolation"

      - name: Security vulnerability scan
        run: "echo skipped-for-baseline-isolation"
      - name: Build validation
        run: bunx prettier --check src/main.ts src/app.ts src/shared/HandTracker.ts

      - name: Check chunk sizes
        run: "echo skipped-for-baseline-isolation"
